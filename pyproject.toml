[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keytool"
version = "1.0.0"
description = "Key & BPM analysis, music library search and MCP server"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "librosa>=0.10.1", "soundfile>=0.12", "av>=12.0",
                "mutagen>=1.47", "PySide6>=6.6", "mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
keytool-mcp = "keytool.mcp_server:run"

[project.gui-scripts]
keytool = "keytool.__main__:main"

[tool.setuptools.packages.find]
include = ["keytool*"]

[tool.setuptools.package-data]
keytool = ["resources/*"]
